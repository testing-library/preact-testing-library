name: release
on:
  push:
    branches:
      # Match SemVer major release branches
      # e.g. "12.x" or "8.x"
      - '[0-9]+.x'
      - 'main'
      - 'next'
      - 'next-major'
      - 'beta'
      - 'alpha'
      - '!all-contributors/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    permissions:
      contents: read # to fetch code (actions/checkout)
    # ignore all-contributors PRs
    if: ${{ !contains(github.head_ref, 'all-contributors') }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 📥 Download deps
        uses: bahmutov/npm-install@v1
        with:
          useLockFile: false

      - name: 🧹 Run lint script
        run: npm run lint

      - name: 🧪 Run tests with coverage
        run: npm test -- --coverage

      - name: 🧼 Run clean script
        run: npm run clean

      - name: 🏗 Run build script
        run: npm run build

      - name: ⬆️ Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false # Temp because token is invalid
          flags: node-${{ matrix.node }}
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    permissions:
      id-token: write # to enable use of OIDC (npm trusted publishing and provenance)
      actions: write # to cancel/stop running workflows
      contents: write # to create release tags
      issues: write # to post release notes that resolve issues
      pull-requests: write # to comment on released pull requests

    needs: validate
    runs-on: ubuntu-latest
    if:
      ${{ github.repository == 'testing-library/preact-testing-library' &&
      github.event_name == 'push' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📥 Download deps
        uses: bahmutov/npm-install@v1
        with:
          useLockFile: false

      - name: 🏗 Run build script
        run: npm run build

      - name: 🚀 Release
        uses: cycjimmy/semantic-release-action@v5
        with:
          semantic_version: 25
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'main',
              'next',
              'next-major',
              {name: 'beta', prerelease: true},
              {name: 'alpha', prerelease: true}
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
